<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas - Contacto</title>
</head>
<body>
    <header>
        <a href="index.html"><img src="recursos/imagenes/perro.png" alt="Logo" width="50" height="50"></a>
        <nav>
            <a href="./">Inicio</a>
            <a href="./contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <h1>Contacto</h1>
        <h2>Escribinos</h2>
        
        <!-- A donde mandar datos y cómo -->
        <form action="./contacto.html" method="post">
            
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">
            
            <label for="id-email">Email</label>
            <input type="email" name="email" id="id-email">
            
            <label for="id-mascota">Mascota</label>
            <select name="mascota" id="id-mascota">
                <option value="perro">Perro</option>
                <option value="gato">Gato</option>
                <option value="loro">Loro</option>
            </select>

            <label for="id-comentario">Comentario</label>
            <textarea name="comentario" id="id-comentario"></textarea>
            
            <button type="submit">Enviar</button>
            <button type="reset">Limpiar</button>
            <!-- Semántica asociada a la accesibilidad -->
        </form>

        <h2>Donde estamos</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3405.1057126935025!2d-64.19341692511827!3d-31.411213395999887!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432987f1fdacec1%3A0x27c3302cef9326ac!2sCentro%20Norte%2C%20Av.%20Figueroa%20Alcorta%20220%2C%20X5000%20KFP%2C%20C%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1788179976246!5m2!1ses-419!2sar" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>
    <footer>
        <ul>
            <li><a href="https://instagram.com/huellitas">@huellitas_insta</a></li>
            <li>Av. Figueroa Alcorta 220</li>
        </ul>
    </footer>
</body>
</html>
